<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escola de Saúde Pública de Florianópolis</title>
<meta name="description" content="Escola de Saúde Pública de Florianópolis — residências, especializações, cursos e eventos de educação em saúde da Secretaria Municipal de Saúde.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --azul: #0F4C81;
    --azul-escuro: #0A3358;
    --verde: #1E8C7A;
    --verde-claro: #E3F3F0;
    --fundo: #FFFFFF;
    --superficie: #F2F5F8;
    --texto: #1C2730;
    --cinza: #566573;
    --linha: #D6DEE6;
    --largura: 1180px;
    --fonte: "Source Sans 3", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } }
  body { margin: 0; font-family: var(--fonte); font-size: 17px; line-height: 1.55; color: var(--texto); background: var(--fundo); }
  a { color: var(--azul); text-underline-offset: 3px; }
  a:hover { color: var(--verde); }
  :focus-visible { outline: 3px solid var(--verde); outline-offset: 2px; }
  img { max-width: 100%; }
  h1, h2, h3, h4 { line-height: 1.2; margin: 0; font-weight: 700; color: var(--azul-escuro); }
  h1 { font-size: 2.1rem; letter-spacing: -0.01em; }
  h2 { font-size: 1.45rem; }
  h3 { font-size: 1.15rem; }
  p { margin: 0 0 1em; }
  .container { max-width: var(--largura); margin: 0 auto; padding: 0 24px; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  /* Cabeçalho */
  .topo { border-bottom: 1px solid var(--linha); }
  .topo .container { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-top: 18px; padding-bottom: 18px; }
  .marca { display: flex; align-items: center; gap: 14px; text-decoration: none; color: inherit; }
  .marca img { height: 64px; width: auto; }
  .topo-direita { display: flex; align-items: center; gap: 16px; }
  .brasao { height: 64px; width: auto; }
  .marca-nome { font-size: 1.3rem; font-weight: 700; color: var(--azul-escuro); line-height: 1.15; }
  .marca-orgao { font-size: 0.92rem; color: var(--cinza); }
  .menu-botao { display: none; background: none; border: 1px solid var(--linha); border-radius: 6px; padding: 8px 12px; font: inherit; color: var(--azul-escuro); cursor: pointer; }

  .nav { background: var(--azul-escuro); }
  .nav ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; }
  .nav a { display: block; padding: 13px 16px; color: #fff; text-decoration: none; font-weight: 600; font-size: 0.98rem; border-bottom: 3px solid transparent; }
  .nav a:hover { background: rgba(255,255,255,0.08); color: #fff; }
  .nav a.ativo { border-bottom-color: var(--verde); }
  .nav a.externo::after { content: " ↗"; font-weight: 400; opacity: 0.7; }

  /* Conteúdo */
  main { min-height: 60vh; }
  .migalhas { font-size: 0.9rem; color: var(--cinza); padding: 18px 0 0; }
  .migalhas a { color: var(--cinza); }
  .migalhas span::before { content: "›"; margin: 0 8px; }
  .pagina { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 48px; padding: 24px 0 64px; }
  .pagina.sem-lateral { grid-template-columns: minmax(0, 1fr); }
  .lateral { position: sticky; top: 16px; align-self: start; }
  .lateral h2 { font-size: 0.95rem; color: var(--cinza); font-weight: 600; margin: 0 0 8px; }
  .lateral ul { list-style: none; margin: 0 0 18px; padding: 0; border-left: 2px solid var(--linha); }
  .lateral li a { display: block; padding: 6px 12px; text-decoration: none; color: var(--texto); font-size: 0.97rem; margin-left: -2px; border-left: 2px solid transparent; }
  .lateral li a:hover { color: var(--azul); }
  .lateral li a.ativo { border-left-color: var(--verde); color: var(--azul-escuro); font-weight: 600; }
  .lateral details summary { cursor: pointer; font-weight: 600; color: var(--azul-escuro); padding: 10px 0; }
  .conteudo { max-width: 72ch; }
  .conteudo header { margin-bottom: 24px; }
  .subtitulo { font-size: 1.15rem; color: var(--cinza); margin: 6px 0 0; }
  .texto h2 { margin: 1.6em 0 0.5em; padding-top: 0.4em; border-top: 1px solid var(--linha); }
  .texto h2:first-child { margin-top: 0; border-top: 0; padding-top: 0; }
  .texto h3 { margin: 1.3em 0 0.4em; }
  .texto ul, .texto ol { padding-left: 1.3em; margin: 0 0 1em; }
  .texto li { margin-bottom: 0.3em; }
  .texto blockquote { margin: 0 0 1em; padding: 8px 16px; border-left: 4px solid var(--verde); background: var(--superficie); }
  .texto table { border-collapse: collapse; width: 100%; margin: 0 0 1em; font-size: 0.95rem; }
  .texto th, .texto td { border: 1px solid var(--linha); padding: 6px 10px; text-align: left; vertical-align: top; }
  .texto th { background: var(--superficie); }
  .vazio { color: var(--cinza); font-style: italic; }
  .servico-acesso { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin: 0 0 1.2em; }
  .servico-acesso span { color: var(--cinza); font-size: 0.95rem; }

  .arquivos { margin-top: 32px; border-top: 1px solid var(--linha); padding-top: 16px; }
  .arquivos h2 { font-size: 1rem; color: var(--cinza); font-weight: 600; margin-bottom: 8px; }
  .arquivos ul { list-style: none; margin: 0; padding: 0; }
  .arquivos li { padding: 8px 0; border-bottom: 1px solid var(--linha); }
  .arquivos > ul > li > a::before { content: "⤓"; margin-right: 8px; color: var(--verde); }

  /* Ficha de programa */
  .ficha { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px 24px; padding: 18px 20px; background: var(--superficie); border-radius: 8px; margin: 0 0 28px; }
  .ficha dt { font-size: 0.85rem; color: var(--cinza); }
  .ficha dd { margin: 0; font-weight: 600; color: var(--azul-escuro); }

  /* Listas e cards */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; list-style: none; margin: 0; padding: 0; }
  .card { border: 1px solid var(--linha); border-radius: 8px; padding: 18px; background: var(--fundo); display: flex; flex-direction: column; gap: 6px; }
  .card h3 { font-size: 1.05rem; }
  .card p { margin: 0; color: var(--cinza); font-size: 0.95rem; }
  .card .icone { font-size: 1.6rem; line-height: 1; }
  .card .acao { margin-top: auto; padding-top: 10px; }
  .card a.cardlink { text-decoration: none; }
  .card a.cardlink:hover h3 { color: var(--verde); }
  .botao { display: inline-block; padding: 8px 14px; border-radius: 6px; background: var(--azul); color: #fff; text-decoration: none; font-weight: 600; font-size: 0.95rem; }
  .botao:hover { background: var(--verde); color: #fff; }
  .botao.secundario { background: transparent; color: var(--azul); border: 1px solid var(--azul); }
  .botao.secundario:hover { color: var(--verde); border-color: var(--verde); background: transparent; }
  .etiqueta { display: inline-block; align-self: flex-start; font-size: 0.78rem; font-weight: 600; padding: 2px 8px; border-radius: 4px; background: var(--superficie); color: var(--cinza); }
  .etiqueta.aberto { background: var(--verde-claro); color: #136456; }
  .etiqueta.encerrado { background: #EEF1F4; color: #6B7A89; }
  .etiqueta.andamento { background: #FFF4DB; color: #7A5A00; }

  .lista { list-style: none; margin: 0; padding: 0; }
  .lista li { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--linha); }
  .lista .quando { color: var(--cinza); font-size: 0.95rem; }
  .lista .quando strong { display: block; color: var(--azul-escuro); font-size: 1.15rem; line-height: 1.1; }
  .lista h3 { font-size: 1.08rem; }
  .lista p { margin: 4px 0 0; color: var(--cinza); font-size: 0.97rem; }
  .lista .meta { font-size: 0.9rem; color: var(--cinza); margin-top: 4px; }

  .filtros { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 18px; }
  .filtros select { font: inherit; padding: 6px 10px; border: 1px solid var(--linha); border-radius: 6px; background: #fff; color: var(--texto); }

  .equipe { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; list-style: none; margin: 0; padding: 0; }
  .equipe li { text-align: left; }
  .equipe .foto { width: 88px; height: 88px; border-radius: 50%; object-fit: cover; background: var(--superficie); display: block; margin-bottom: 8px; }
  .equipe .funcao { color: var(--cinza); font-size: 0.95rem; }
  .equipe a { font-size: 0.9rem; word-break: break-all; }

  .grupo-titulo { margin: 28px 0 10px; font-size: 1rem; color: var(--cinza); font-weight: 600; }
  .grupo-titulo:first-child { margin-top: 0; }

  /* Página inicial */
  .hero {
    color: #fff; padding: 64px 0 60px; position: relative; isolation: isolate;
    background: var(--azul-escuro) url("ponte-hercilio-luz.jpg") center 40% / cover no-repeat;
  }
  .hero::before {
    content: ""; position: absolute; inset: 0; z-index: -1;
    background: linear-gradient(90deg, rgba(10,51,88,0.94) 0%, rgba(10,51,88,0.88) 42%, rgba(10,51,88,0.45) 75%, rgba(10,51,88,0.3) 100%);
  }
  .hero h1, .hero p { text-shadow: 0 1px 3px rgba(0,0,0,0.35); }
  .hero h1 { color: #fff; font-size: 2.4rem; max-width: 22ch; }
  .hero p { max-width: 60ch; font-size: 1.15rem; margin: 16px 0 0; color: rgba(255,255,255,0.88); }
  .faixa-avisos { background: var(--verde-claro); border-bottom: 1px solid #CDE7E1; }
  .faixa-avisos ul { list-style: none; margin: 0; padding: 12px 0; display: flex; flex-direction: column; gap: 6px; }
  .faixa-avisos li { font-size: 0.98rem; }
  .faixa-avisos li::before { content: "●"; color: var(--verde); margin-right: 10px; font-size: 0.7rem; vertical-align: middle; }
  .inicio section { padding: 40px 0 0; }
  .inicio section:last-child { padding-bottom: 64px; }
  .inicio h2 { margin-bottom: 16px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .inicio h2 a { font-size: 0.95rem; font-weight: 600; }
  .duas-colunas { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; }
  .secoes { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px 24px; list-style: none; margin: 0; padding: 0; }
  .secoes li { border-top: 2px solid var(--linha); padding: 12px 0 8px; }
  .secoes a.sec { font-weight: 700; font-size: 1.05rem; text-decoration: none; color: var(--azul-escuro); }
  .secoes a.sec:hover { color: var(--verde); }
  .secoes p { font-size: 0.92rem; color: var(--cinza); margin: 4px 0 0; }

  /* Rodapé */
  footer { background: var(--superficie); border-top: 1px solid var(--linha); color: var(--cinza); font-size: 0.93rem; margin-top: 24px; }
  footer .container { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 32px; padding-top: 32px; padding-bottom: 32px; }
  footer h3 { font-size: 1rem; margin-bottom: 8px; }
  footer p { margin: 0 0 4px; }
  footer ul { list-style: none; margin: 0; padding: 0; }
  footer li { margin-bottom: 4px; }
  .rodape-base { border-top: 1px solid var(--linha); font-size: 0.85rem; }
  .rodape-base .container { display: block; padding: 12px 24px; }

  .carregando, .erro { padding: 64px 24px; text-align: center; color: var(--cinza); }
  .erro { color: #8A2E2E; }

  @media (max-width: 900px) {
    .pagina { grid-template-columns: 1fr; gap: 24px; }
    .lateral { position: static; }
    .duas-colunas { grid-template-columns: 1fr; gap: 24px; }
    footer .container { grid-template-columns: 1fr; gap: 20px; }
    .hero h1 { font-size: 1.9rem; }
    .hero::before { background: rgba(10,51,88,0.85); }
    h1 { font-size: 1.7rem; }
  }
  @media (max-width: 700px) {
    .menu-botao { display: inline-block; }
    .marca img { height: 48px; }
    .brasao { display: none; }
    .nav ul { display: none; flex-direction: column; }
    .nav.aberto ul { display: flex; }
    .nav a { border-bottom: 1px solid rgba(255,255,255,0.08); }
    .lista li { grid-template-columns: 1fr; gap: 4px; }
    .lista .quando strong { display: inline; font-size: 1rem; margin-right: 4px; }
  }
  @media print { .nav, .menu-botao, footer, .lateral { display: none; } .pagina { grid-template-columns: 1fr; } }
</style>
</head>

<script>
(function () {
  'use strict';
  var C = null; // conteúdo carregado
  // Web App da Agenda NEPS; com ?formato=json devolve os próximos eventos.
  // Pode ser trocada pela chave agenda_api na aba CONFIG da planilha.
  var URL_AGENDA_PADRAO = 'https://script.google.com/macros/s/AKfycbxHz8kDViCyiOlQT0iSkG6lkoPvVNmSajDYyD7UkXxQ6qUzRZdPHEL4VfOLw0TUG9M3/exec';
  var $main = document.getElementById('conteudo');

  /* ---------- utilitários ---------- */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmtData(iso) {
    if (!iso) return '';
    var p = iso.split('-');
    return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : iso;
  }
  var MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  function diaMes(iso) {
    if (!iso) return '';
    var p = iso.split('-');
    return '<strong>' + Number(p[2]) + '</strong>' + MESES[Number(p[1]) - 1] + ' ' + p[0];
  }
  function hoje() { return new Date().toISOString().slice(0, 10); }
  function ehUrl(u) { return /^(https?:\/\/|mailto:|#\/)/.test(u || ''); }
  function hrefItem(item) {
    if (item.tipo === 'link') return item.destino;
    if (item.tipo === 'inicio') return '#/';
    return item.nivel === 1 ? '#/' + item.id : '#/' + item.pai + '/' + item.id;
  }

  /* Markdown mínimo: títulos, negrito, itálico, links, listas, citações, tabelas, parágrafos. HTML é mantido. */
  function normaliza(s) { return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim(); }
  function servicoPorNome(nome) {
    var n = normaliza(nome);
    return C.servicos.filter(function (s) { return normaliza(s.nome) === n; })[0];
  }
  function blocoServico(nome) {
    var s = servicoPorNome(nome);
    if (!s) return '<p class="vazio">Serviço "' + esc(nome) + '" não encontrado na aba SERVICOS.</p>';
    if (!ehUrl(s.link)) return '<p class="vazio">' + esc(s.nome) + ': link ainda não informado.</p>';
    return '<div class="servico-acesso"><a class="botao" href="' + esc(s.link) + '" target="_blank" rel="noopener">Acessar: ' + esc(s.nome) + '</a>' +
      (s.descricao ? '<span>' + esc(s.descricao) + '</span>' : '') + '</div>';
  }
  function md(texto) {
    if (!texto) return '';
    texto = String(texto)
      .replace(/\{\{\s*servicos\s*\}\}/gi, function () { return '\n' + cardsServicos(C.servicos) + '\n'; })
      .replace(/\{\{\s*servico\s*:\s*([^}]+?)\s*\}\}/gi, function (m, nome) { return '\n' + blocoServico(nome) + '\n'; });
    var linhas = texto.replace(/\r/g, '').split('\n');
    var html = '', i = 0;
    function inline(s) {
      return s
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/(^|[^*])\*([^*]+?)\*/g, '$1<em>$2</em>')
        .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (m, t, u) {
          return '<a href="' + u + '"' + (/^https?:/.test(u) ? ' target="_blank" rel="noopener"' : '') + '>' + t + '</a>';
        })
        .replace(/(^|\s)(https?:\/\/[^\s<]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
    }
    while (i < linhas.length) {
      var l = linhas[i];
      var m;
      if ((m = l.match(/^(#{1,4})\s+(.*)/))) {
        var nivel = Math.min(m[1].length + 1, 4);
        html += '<h' + nivel + '>' + inline(m[2]) + '</h' + nivel + '>'; i++; continue;
      }
      if (/^\s*[-*]\s+/.test(l)) {
        html += '<ul>';
        while (i < linhas.length && /^\s*[-*]\s+/.test(linhas[i])) { html += '<li>' + inline(linhas[i].replace(/^\s*[-*]\s+/, '')) + '</li>'; i++; }
        html += '</ul>'; continue;
      }
      if (/^\s*\d+[.)]\s+/.test(l)) {
        html += '<ol>';
        while (i < linhas.length && /^\s*\d+[.)]\s+/.test(linhas[i])) { html += '<li>' + inline(linhas[i].replace(/^\s*\d+[.)]\s+/, '')) + '</li>'; i++; }
        html += '</ol>'; continue;
      }
      if (/^>\s?/.test(l)) {
        var cit = [];
        while (i < linhas.length && /^>\s?/.test(linhas[i])) { cit.push(linhas[i].replace(/^>\s?/, '')); i++; }
        html += '<blockquote>' + inline(cit.join(' ')) + '</blockquote>'; continue;
      }
      if (/^\|.*\|\s*$/.test(l)) {
        var tab = [];
        while (i < linhas.length && /^\|.*\|\s*$/.test(linhas[i])) { tab.push(linhas[i]); i++; }
        var celulas = function (r) { return r.replace(/^\||\|\s*$/g, '').split('|').map(function (c) { return c.trim(); }); };
        var cab = celulas(tab[0]);
        var corpo = tab.slice(1).filter(function (r) { return !/^\|[\s:-|]+\|\s*$/.test(r); });
        html += '<table><thead><tr>' + cab.map(function (c) { return '<th>' + inline(c) + '</th>'; }).join('') + '</tr></thead><tbody>' +
          corpo.map(function (r) { return '<tr>' + celulas(r).map(function (c) { return '<td>' + inline(c) + '</td>'; }).join('') + '</tr>'; }).join('') +
          '</tbody></table>';
        continue;
      }
      if (/^<\w/.test(l.trim())) { // bloco HTML cru: copia até linha em branco
        var bloco = [];
        while (i < linhas.length && linhas[i].trim() !== '') { bloco.push(linhas[i]); i++; }
        html += bloco.join('\n'); continue;
      }
      if (l.trim() === '') { i++; continue; }
      var par = [];
      while (i < linhas.length && linhas[i].trim() !== '' && !/^(#{1,4}\s|\s*[-*]\s|\s*\d+[.)]\s|>|\|)/.test(linhas[i])) { par.push(linhas[i]); i++; }
      html += '<p>' + inline(par.join('<br>')) + '</p>';
    }
    return html;
  }

  /* ---------- navegação ---------- */
  function itensNivel1() { return C.menu.filter(function (m) { return m.nivel === 1; }); }
  function filhos(idPai) { return C.menu.filter(function (m) { return m.nivel === 2 && m.pai === idPai; }); }
  function item(id) { for (var i = 0; i < C.menu.length; i++) if (C.menu[i].id === id) return C.menu[i]; return null; }

  function montarNav(ativoId) {
    var ul = document.getElementById('nav-lista');
    ul.innerHTML = itensNivel1().map(function (m) {
      var ext = m.tipo === 'link';
      return '<li><a href="' + esc(hrefItem(m)) + '"' + (ext ? ' class="externo" target="_blank" rel="noopener"' : (m.id === ativoId ? ' class="ativo" aria-current="page"' : '')) + '>' + esc(m.rotulo) + '</a></li>';
    }).join('');
  }

  function lateral(secao, ativoId) {
    var lista = filhos(secao.id);
    if (!lista.length) return '';
    var grupos = [], porGrupo = {};
    lista.forEach(function (m) {
      var g = m.grupo || '';
      if (!porGrupo[g]) { porGrupo[g] = []; grupos.push(g); }
      porGrupo[g].push(m);
    });
    var html = grupos.map(function (g) {
      return (g ? '<h2>' + esc(g) + '</h2>' : '') + '<ul>' + porGrupo[g].map(function (m) {
        var ext = m.tipo === 'link';
        return '<li><a href="' + esc(hrefItem(m)) + '"' + (ext ? ' target="_blank" rel="noopener"' : (m.id === ativoId ? ' class="ativo" aria-current="page"' : '')) + '>' + esc(m.rotulo) + (ext ? ' ↗' : '') + '</a></li>';
      }).join('') + '</ul>';
    }).join('');
    var aberto = window.matchMedia('(min-width: 901px)').matches ? ' open' : '';
    return '<aside class="lateral"><details' + aberto + '><summary>' + esc(secao.rotulo) + '</summary>' + html + '</details></aside>';
  }

  function migalhas(partes) {
    return '<nav class="migalhas container" aria-label="Você está em"><a href="#/">Início</a>' +
      partes.map(function (p) { return '<span>' + (p.href ? '<a href="' + esc(p.href) + '">' + esc(p.rotulo) + '</a>' : esc(p.rotulo)) + '</span>'; }).join('') + '</nav>';
  }

  function arquivos(lista) {
    if (!lista || !lista.length) return '';
    return '<div class="arquivos"><h2>Arquivos para download</h2><ul>' +
      lista.map(function (a) { return '<li><a href="' + esc(a.url) + '" target="_blank" rel="noopener">' + esc(a.nome) + '</a></li>'; }).join('') + '</ul></div>';
  }

  /* ---------- blocos de conteúdo ---------- */
  function blocoPagina(slug) {
    var p = C.paginas[slug];
    if (!p) return '<header><h1>Página não encontrada</h1></header><p class="vazio">O endereço aponta para uma página que não está publicada.</p>';
    return '<header><h1>' + esc(p.titulo) + '</h1>' + (p.subtitulo ? '<p class="subtitulo">' + esc(p.subtitulo) + '</p>' : '') + '</header>' +
      '<div class="texto">' + md(p.corpo) + '</div>' + arquivos(p.arquivos);
  }

  function blocoPrograma(id) {
    var p = C.programas[id];
    if (!p) return '<header><h1>Programa não encontrado</h1></header>';
    var campos = [['Duração', p.duracao], ['Vagas', p.vagas], ['Carga horária', p.carga_horaria], ['Coordenação', p.coordenacao], ['Contato', p.contato]]
      .filter(function (c) { return c[1]; });
    var editais = C.editais.filter(function (e) { return e.programa === id; });
    return '<header><h1>' + esc(p.nome) + '</h1>' + (p.resumo ? '<p class="subtitulo">' + esc(p.resumo) + '</p>' : '') + '</header>' +
      (campos.length ? '<dl class="ficha">' + campos.map(function (c) { return '<div><dt>' + esc(c[0]) + '</dt><dd>' + esc(c[1]) + '</dd></div>'; }).join('') + '</dl>' : '') +
      '<div class="texto">' + md(p.corpo) + '</div>' + arquivos(p.arquivos) +
      (editais.length ? '<div class="arquivos"><h2>Editais e documentos do programa</h2>' + listaEditais(editais, false) + '</div>' : '');
  }

  function etiquetaStatus(s) {
    var cls = /aberto/i.test(s) ? 'aberto' : /andamento/i.test(s) ? 'andamento' : 'encerrado';
    return s ? '<span class="etiqueta ' + cls + '">' + esc(s) + '</span>' : '';
  }

  function listaEditais(lista, comFiltro) {
    if (!lista.length) return '<p class="vazio">Nenhum edital publicado no momento.</p>';
    var anos = [], tipos = [];
    lista.forEach(function (e) { if (e.ano && anos.indexOf(e.ano) < 0) anos.push(e.ano); if (e.tipo && tipos.indexOf(e.tipo) < 0) tipos.push(e.tipo); });
    anos.sort().reverse();
    var filtro = comFiltro ? '<div class="filtros">' +
      '<select id="f-ano" aria-label="Ano"><option value="">Todos os anos</option>' + anos.map(function (a) { return '<option>' + esc(a) + '</option>'; }).join('') + '</select>' +
      '<select id="f-tipo" aria-label="Tipo"><option value="">Todos os tipos</option>' + tipos.map(function (t) { return '<option>' + esc(t) + '</option>'; }).join('') + '</select>' +
      '<select id="f-status" aria-label="Status"><option value="">Qualquer status</option><option>Aberto</option><option>Em andamento</option><option>Encerrado</option></select></div>' : '';
    return filtro + '<ul class="lista" id="lista-editais">' + lista.map(function (e) {
      var prog = C.programas[e.programa];
      return '<li data-ano="' + esc(e.ano) + '" data-tipo="' + esc(e.tipo) + '" data-status="' + esc(e.status) + '">' +
        '<div class="quando">' + (e.data ? diaMes(e.data) : esc(e.ano)) + '</div>' +
        '<div><h3>' + (e.link ? '<a href="' + esc(e.link) + '" target="_blank" rel="noopener">' + esc(e.titulo) + '</a>' : esc(e.titulo)) + '</h3>' +
        '<div class="meta">' + etiquetaStatus(e.status) + (e.tipo ? ' <span class="etiqueta">' + esc(e.tipo) + '</span>' : '') + (prog && comFiltro ? ' <span class="etiqueta">' + esc(prog.nome) + '</span>' : '') + '</div></div></li>';
    }).join('') + '</ul>';
  }

  function ligarFiltros() {
    var sels = ['f-ano', 'f-tipo', 'f-status'].map(function (id) { return document.getElementById(id); });
    if (!sels[0]) return;
    function aplicar() {
      var v = sels.map(function (s) { return s.value; });
      document.querySelectorAll('#lista-editais li').forEach(function (li) {
        var ok = (!v[0] || li.dataset.ano === v[0]) && (!v[1] || li.dataset.tipo === v[1]) && (!v[2] || li.dataset.status === v[2]);
        li.style.display = ok ? '' : 'none';
      });
    }
    sels.forEach(function (s) { s.addEventListener('change', aplicar); });
  }

  function blocoEditais(itemMenu) {
    var f = {};
    (itemMenu.destino || '').split(';').forEach(function (par) {
      var kv = par.split('=');
      if (kv.length === 2) f[kv[0].trim()] = kv[1].split(',').map(function (x) { return x.trim(); });
    });
    var lista = C.editais.filter(function (e) {
      return (!f.grupo || f.grupo.indexOf(e.grupo) >= 0) && (!f.tipo || f.tipo.indexOf(e.tipo) >= 0) && (!f.programa || f.programa.indexOf(e.programa) >= 0);
    });
    return '<header><h1>' + esc(itemMenu.rotulo) + '</h1></header>' + listaEditais(lista, true);
  }

  function blocoLista(tipo, titulo) {
    var h = '<header><h1>' + esc(titulo) + '</h1></header>';
    if (tipo === 'eventos') {
      var hj = hoje();
      var futuros = C.eventos.filter(function (e) { return (e.data_fim || e.data_inicio) >= hj; });
      var passados = C.eventos.filter(function (e) { return (e.data_fim || e.data_inicio) < hj; }).reverse();
      var render = function (lista) {
        return '<ul class="lista">' + lista.map(function (e) {
          return '<li><div class="quando">' + diaMes(e.data_inicio) + (e.data_fim && e.data_fim !== e.data_inicio ? '<br>até ' + fmtData(e.data_fim) : '') + '</div>' +
            '<div><h3>' + (e.link ? '<a href="' + esc(e.link) + '" target="_blank" rel="noopener">' + esc(e.titulo) + '</a>' : esc(e.titulo)) + '</h3>' +
            (e.descricao ? '<p>' + esc(e.descricao) + '</p>' : '') +
            '<div class="meta">' + [e.modalidade, e.local].filter(Boolean).map(esc).join(' — ') + '</div></div></li>';
        }).join('') + '</ul>';
      };
      return h + (futuros.length ? render(futuros) : '<p class="vazio">Nenhum evento agendado no momento.</p>') +
        (passados.length ? '<h2 class="grupo-titulo">Eventos realizados</h2>' + render(passados) : '');
    }
    if (tipo === 'oportunidades') {
      if (!C.oportunidades.length) return h + '<p class="vazio">Nenhuma oportunidade publicada no momento.</p>';
      return h + '<ul class="lista">' + C.oportunidades.map(function (o) {
        return '<li><div class="quando">' + (o.prazo ? 'até<br>' + diaMes(o.prazo) : '') + '</div>' +
          '<div><h3>' + (o.link ? '<a href="' + esc(o.link) + '" target="_blank" rel="noopener">' + esc(o.titulo) + '</a>' : esc(o.titulo)) + '</h3>' +
          (o.descricao ? '<p>' + esc(o.descricao) + '</p>' : '') + (o.instituicao ? '<div class="meta">' + esc(o.instituicao) + '</div>' : '') + '</div></li>';
      }).join('') + '</ul>';
    }
    if (tipo === 'equipe') {
      if (!C.equipe.length) return h + '<p class="vazio">Equipe ainda não publicada.</p>';
      return h + '<ul class="equipe">' + C.equipe.map(function (p) {
        return '<li>' + (p.foto ? '<img class="foto" src="' + esc(p.foto) + '" alt="">' : '<span class="foto" aria-hidden="true"></span>') +
          '<h3>' + esc(p.nome) + '</h3><div class="funcao">' + esc(p.funcao) + '</div>' +
          (p.email ? '<a href="mailto:' + esc(p.email) + '">' + esc(p.email) + '</a>' : '') + '</li>';
      }).join('') + '</ul>';
    }
    if (tipo === 'servicos') {
      return h + cardsServicos(C.servicos);
    }
    if (tipo === 'documentos') {
      if (!C.documentos.length) return h + '<p class="vazio">Nenhum documento publicado no momento.</p>';
      var cats = [], porCat = {};
      C.documentos.forEach(function (d) { if (!porCat[d.categoria]) { porCat[d.categoria] = []; cats.push(d.categoria); } porCat[d.categoria].push(d); });
      return h + cats.map(function (c) {
        return '<h2 class="grupo-titulo">' + esc(c) + '</h2><div class="arquivos" style="margin-top:0;border-top:0;padding-top:0"><ul>' + porCat[c].map(function (d) {
          return '<li>' + (d.link ? '<a href="' + esc(d.link) + '" target="_blank" rel="noopener">' + esc(d.titulo) + '</a>' : esc(d.titulo)) + (d.descricao ? ' <span class="vazio">— ' + esc(d.descricao) + '</span>' : '') + '</li>';
        }).join('') + '</ul></div>';
      }).join('');
    }
    return h + '<p class="vazio">Lista "' + esc(tipo) + '" não reconhecida.</p>';
  }

  function cardsServicos(lista) {
    if (!lista.length) return '<p class="vazio">Nenhum serviço publicado.</p>';
    return '<ul class="cards">' + lista.map(function (s) {
      return '<li class="card">' + (s.icone ? '<span class="icone" aria-hidden="true">' + esc(s.icone) + '</span>' : '') +
        '<h3>' + esc(s.nome) + '</h3><p>' + esc(s.descricao) + '</p>' +
        (s.publico ? '<span class="etiqueta">' + esc(s.publico) + '</span>' : '') +
        (ehUrl(s.link) ? '<div class="acao"><a class="botao" href="' + esc(s.link) + '" target="_blank" rel="noopener">Acessar</a></div>' : '') + '</li>';
    }).join('') + '</ul>';
  }

  function blocoSecao(secao) {
    var lista = filhos(secao.id);
    var grupos = [], porGrupo = {};
    lista.forEach(function (m) { var g = m.grupo || ''; if (!porGrupo[g]) { porGrupo[g] = []; grupos.push(g); } porGrupo[g].push(m); });
    return '<header><h1>' + esc(secao.rotulo) + '</h1></header>' + grupos.map(function (g) {
      return (g ? '<h2 class="grupo-titulo">' + esc(g) + '</h2>' : '') + '<ul class="cards">' + porGrupo[g].map(function (m) {
        var desc = '';
        if (m.tipo === 'programa' && C.programas[m.destino]) desc = C.programas[m.destino].resumo || C.programas[m.destino].nome;
        else if (m.tipo === 'pagina' && C.paginas[m.destino]) desc = C.paginas[m.destino].subtitulo;
        var ext = m.tipo === 'link';
        return '<li class="card"><a class="cardlink" href="' + esc(hrefItem(m)) + '"' + (ext ? ' target="_blank" rel="noopener"' : '') + '><h3>' + esc(m.rotulo) + (ext ? ' ↗' : '') + '</h3></a>' + (desc ? '<p>' + esc(desc) + '</p>' : '') + '</li>';
      }).join('') + '</ul>';
    }).join('');
  }

  /* ---------- página inicial ---------- */
  function paginaInicial() {
    var cfg = C.config, hj = hoje();
    var avisos = C.avisos.filter(function (a) { return !a.valido_ate || a.valido_ate >= hj; });
    var abertos = C.editais.filter(function (e) { return /aberto|andamento/i.test(e.status); }).slice(0, 6);
    var proximos = C.eventos.filter(function (e) { return (e.data_fim || e.data_inicio) >= hj; }).slice(0, 5);
    var secoes = itensNivel1().filter(function (m) { return m.tipo === 'secao'; });
    var servicosItem = C.menu.filter(function (m) { return m.tipo === 'lista' && m.destino === 'servicos'; })[0];
    var agendaItem = C.menu.filter(function (m) { return m.tipo === 'lista' && m.destino === 'eventos'; })[0] ||
      C.menu.filter(function (m) { return m.tipo === 'link' && /agenda/i.test(m.rotulo); })[0];
    var agendaExterna = agendaItem && agendaItem.tipo === 'link';

    var html = '<div class="hero"><div class="container"><h1>' + esc(cfg.nome || 'Escola de Saúde Pública') + '</h1>' + (cfg.descricao ? '<p>' + esc(cfg.descricao) + '</p>' : '') + '</div></div>';
    if (avisos.length) {
      html += '<div class="faixa-avisos"><div class="container"><ul>' + avisos.map(function (a) {
        var t = '<strong>' + esc(a.titulo) + '</strong>' + (a.texto ? ' ' + esc(a.texto) : '');
        return '<li>' + (a.link ? '<a href="' + esc(a.link) + '">' + t + '</a>' : t) + '</li>';
      }).join('') + '</ul></div></div>';
    }
    html += '<div class="inicio container">';
    if (C.servicos.length) {
      html += '<section><h2>Serviços e sistemas' + (servicosItem ? '<a href="' + esc(hrefItem(servicosItem)) + '">ver todos</a>' : '') + '</h2>' + cardsServicos(C.servicos.slice(0, 4)) + '</section>';
    }
    html += '<section class="duas-colunas"><div><h2>Editais abertos</h2>' + (abertos.length ? listaEditais(abertos, false) : '<p class="vazio">Nenhum edital aberto no momento.</p>') + '</div>' +
      '<div><h2>Próximos eventos' + (agendaItem ? '<a href="' + esc(hrefItem(agendaItem)) + '"' + (agendaExterna ? ' target="_blank" rel="noopener"' : '') + '>agenda completa</a>' : '') + '</h2>' +
      (proximos.length ? '<ul class="lista">' + proximos.map(function (e) {
        return '<li><div class="quando">' + diaMes(e.data_inicio) + '</div><div><h3>' + (e.link ? '<a href="' + esc(e.link) + '" target="_blank" rel="noopener">' + esc(e.titulo) + '</a>' : esc(e.titulo)) + '</h3><div class="meta">' + [e.modalidade, e.local].filter(Boolean).map(esc).join(' — ') + '</div></div></li>';
      }).join('') + '</ul>' : (agendaExterna
        ? '<div id="previa-agenda"><p class="vazio">Carregando a agenda…</p></div>'
        : '<p class="vazio">Nenhum evento agendado no momento.</p>')) + '</div></section>';
    html += '<section><h2>Conheça a Escola</h2><ul class="secoes">' + secoes.map(function (s) {
      var f = filhos(s.id);
      return '<li><a class="sec" href="' + esc(hrefItem(s)) + '">' + esc(s.rotulo) + '</a><p>' + esc(f.slice(0, 4).map(function (x) { return x.rotulo; }).join(', ')) + (f.length > 4 ? '…' : '') + '</p></li>';
    }).join('') + '</ul></section>';
    html += '</div>';
    return html;
  }

  /* ---------- prévia da Agenda NEPS ---------- */
  function carregarPreviaAgenda() {
    var alvo = document.getElementById('previa-agenda');
    if (!alvo) return;
    var agendaItem = C.menu.filter(function (m) { return m.tipo === 'link' && /agenda/i.test(m.rotulo); })[0];
    var urlAgenda = agendaItem ? agendaItem.destino : '';
    var api = ehUrl(C.config.agenda_api) ? C.config.agenda_api : URL_AGENDA_PADRAO;
    var fallback = '<p>A programação de eventos de educação permanente está na <a href="' + esc(urlAgenda) + '" target="_blank" rel="noopener">agenda do NEPS</a>.</p>';

    fetch(api + '?formato=json&n=4')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (json) {
        var evs = (json && json.eventos) || [];
        if (!evs.length) { alvo.innerHTML = '<p class="vazio">Nenhum evento agendado no momento.</p>'; return; }
        alvo.innerHTML = '<ul class="lista">' + evs.map(function (e) {
          var quando = e.proximaData || e.dataInicio;
          var detalhe = '';
          if (e.totalEncontros > 1) detalhe = 'encontro ' + e.encontroIndice + ' de ' + e.totalEncontros;
          if (e.dataFim && e.dataFim > quando) detalhe += (detalhe ? ', ' : '') + 'até ' + fmtData(e.dataFim);
          var meta = [e.modalidade, e.local].filter(Boolean).map(esc).join(' — ');
          var href = ehUrl(e.linkInscricao) ? e.linkInscricao : urlAgenda;
          return '<li><div class="quando">' + diaMes(quando) + (detalhe ? '<br><small>' + esc(detalhe) + '</small>' : '') + '</div>' +
            '<div><h3><a href="' + esc(href) + '" target="_blank" rel="noopener">' + esc(e.nome) + '</a></h3>' +
            (meta ? '<div class="meta">' + meta + '</div>' : '') + '</div></li>';
        }).join('') + '</ul>';
      })
      .catch(function () { alvo.innerHTML = fallback; });
  }

  /* ---------- rodapé ---------- */
  function rodape() {
    var cfg = C.config;
    var redes = [['Instagram', cfg.instagram], ['Facebook', cfg.facebook], ['YouTube', cfg.youtube], ['LinkedIn', cfg.linkedin]].filter(function (r) { return ehUrl(r[1]); });
    document.getElementById('rodape').innerHTML =
      '<div class="container"><div><h3>' + esc(cfg.nome || '') + '</h3>' + (cfg.orgao ? '<p>' + esc(cfg.orgao) + '</p>' : '') + (cfg.endereco && !/^PREENCHER/.test(cfg.endereco) ? '<p>' + esc(cfg.endereco) + '</p>' : '') + '</div>' +
      '<div><h3>Contato</h3>' + (cfg.email ? '<p><a href="mailto:' + esc(cfg.email) + '">' + esc(cfg.email) + '</a></p>' : '') + (cfg.telefone ? '<p>' + esc(cfg.telefone) + '</p>' : '') + '</div>' +
      '<div>' + (redes.length ? '<h3>Redes sociais</h3><ul>' + redes.map(function (r) { return '<li><a href="' + esc(r[1]) + '" target="_blank" rel="noopener">' + r[0] + '</a></li>'; }).join('') + '</ul>' : '') + '</div></div>' +
      '<div class="rodape-base"><div class="container">Conteúdo atualizado em ' + fmtData((C.gerado_em || '').slice(0, 10)) + '.</div></div>';
  }

  /* ---------- roteador ---------- */
  function rota() {
    var partes = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
    var cfg = C.config;
    var titulo = cfg.sigla || cfg.nome || '';
    window.scrollTo(0, 0);

    if (!partes.length) {
      montarNav('inicio');
      $main.innerHTML = paginaInicial();
      document.title = cfg.nome || titulo;
      carregarPreviaAgenda();
      return;
    }
    var secao = item(partes[0]);
    if (!secao || secao.nivel !== 1) { naoEncontrada(); return; }
    montarNav(secao.id);

    var atual = partes[1] ? item(partes[1]) : null;
    if (partes[1] && (!atual || atual.pai !== secao.id)) { naoEncontrada(); return; }

    var bloco, rotuloAtual = '';
    if (!atual) {
      if (secao.tipo === 'pagina') bloco = blocoPagina(secao.destino);
      else if (secao.tipo === 'programa') bloco = blocoPrograma(secao.destino);
      else if (secao.tipo === 'editais') bloco = blocoEditais(secao);
      else if (secao.tipo === 'lista') bloco = blocoLista(secao.destino, secao.rotulo);
      else bloco = blocoSecao(secao);
    } else {
      rotuloAtual = atual.rotulo;
      if (atual.tipo === 'pagina') bloco = blocoPagina(atual.destino);
      else if (atual.tipo === 'programa') bloco = blocoPrograma(atual.destino);
      else if (atual.tipo === 'editais') bloco = blocoEditais(atual);
      else if (atual.tipo === 'lista') bloco = blocoLista(atual.destino, atual.rotulo);
      else bloco = blocoSecao(atual);
    }
    var temLateral = filhos(secao.id).length > 0;
    $main.innerHTML = migalhas([{ rotulo: secao.rotulo, href: atual ? hrefItem(secao) : '' }].concat(atual ? [{ rotulo: atual.rotulo }] : [])) +
      '<div class="container pagina' + (temLateral ? '' : ' sem-lateral') + '">' + (temLateral ? lateral(secao, atual ? atual.id : '') : '') +
      '<article class="conteudo">' + bloco + '</article></div>';
    document.title = (rotuloAtual || secao.rotulo) + ' — ' + titulo;
    ligarFiltros();
  }

  function naoEncontrada() {
    montarNav('');
    $main.innerHTML = '<div class="container pagina sem-lateral"><article class="conteudo"><header><h1>Página não encontrada</h1></header><p>O endereço não corresponde a nenhuma página publicada. <a href="#/">Voltar ao início</a>.</p></article></div>';
  }

  /* ---------- inicialização ---------- */
  function aplicarConfig() {
    var cfg = C.config;
    document.getElementById('marca-nome').textContent = cfg.nome || 'Escola de Saúde Pública';
    document.getElementById('marca-orgao').textContent = cfg.orgao || '';
    if (ehUrl(cfg.logo_url)) document.getElementById('logo-esp').src = cfg.logo_url;
    if (/^#[0-9a-f]{6}$/i.test(cfg.cor_primaria)) document.documentElement.style.setProperty('--azul', cfg.cor_primaria);
    if (/^#[0-9a-f]{6}$/i.test(cfg.cor_destaque)) document.documentElement.style.setProperty('--verde', cfg.cor_destaque);
  }

  document.getElementById('menu-botao').addEventListener('click', function () {
    var nav = document.getElementById('nav');
    var aberto = nav.classList.toggle('aberto');
    this.setAttribute('aria-expanded', aberto ? 'true' : 'false');
  });
  window.addEventListener('hashchange', function () {
    document.getElementById('nav').classList.remove('aberto');
    if (C) rota();
  });

  fetch('conteudo.json?v=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (json) { C = json; aplicarConfig(); rodape(); rota(); })
    .catch(function (e) {
      $main.innerHTML = '<div class="erro"><p><strong>O conteúdo do site ainda não foi publicado.</strong></p><p>Na planilha, use o menu "🌐 Site da ESP" → "Publicar site agora". Se o problema continuar, confira se o arquivo conteudo.json existe no repositório. (' + esc(e.message) + ')</p></div>';
    });
})();
</script>
</body>
</html>
